version: "3.8"
services:
  core-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - MONGODB_HOST=${MONGODB_HOST:-mongodb}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-chatbot}
      - JWT_SECRET=${JWT_SECRET:-devsecret}
      - MODEL_FORWARDING_ENDPOINT=${MODEL_FORWARDING_ENDPOINT:-http://nlu-runtime:8001}
      - OLLSAMA_* 
    depends_on:
      - mongodb
      - nlu-runtime
  mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"
  nlu-runtime:
    build:
      context: .
      dockerfile: ./ai-chatbot-framework/dockerfiles/Dockerfile.nlu
    depends_on:
      - mongodb
    environment:
      - MODEL_DIR=/models
      - SPACY_LANG_MODEL=en_core_web_sm
    ports:
      - "8001:8001"